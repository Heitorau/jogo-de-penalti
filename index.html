<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hora do Pênalti</title><link rel="stylesheet" href="style.css"><style>#meter{width:min(540px,92%);height:14px;margin:7px auto 13px;border-radius:9px;position:relative;background:linear-gradient(90deg,#e33 0 20%,#ffd329 20% 42%,#22b85d 42% 58%,#ffd329 58% 80%,#e33 80%)}#needle{position:absolute;top:-6px;width:5px;height:26px;border-radius:4px;background:#fff;box-shadow:0 0 3px #000;transform:translateX(-50%)}#precision{font:700 12px 'DM Sans';margin:0;color:#fff}.team-player{position:absolute;z-index:2;font-size:42px;filter:drop-shadow(0 4px 2px #0008);animation:run 1.1s ease-in-out infinite alternate}.team-player:nth-child(2){animation-delay:-.35s}.team-player:nth-child(3){animation-delay:-.7s}@keyframes run{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-12px) rotate(3deg)}}</style></head><body><main><header>⚽ HORA DO <b>PÊNALTI</b><span id="level">DIFICULDADE: MÉDIO</span></header><section id="score"><div>VOCÊ<strong id="you">0</strong></div><div>RODADA<strong id="round">1 / 5</strong></div><div>ADVERSÁRIO<strong id="opp">0</strong></div></section><section id="field"><div id="goal"></div><div class="team-player" style="left:9%;bottom:23px">🟢</div><div class="team-player" style="left:17%;bottom:68px">🟢</div><div class="team-player" style="right:10%;bottom:40px">🟢</div><div id="keeper">🧤</div><div id="ball">⚽</div></section><section id="controls"><h2 id="turn">SUA VEZ DE BATER</h2><p id="hint">ESCOLHA ONDE CHUTAR</p><div id="meter"><i id="needle"></i></div><p id="precision">PARE A SETA NA FAIXA VERDE</p><div><button data-dir="left">↖<small>ESQUERDA</small></button><button data-dir="center">↑<small>MEIO</small></button><button data-dir="right">↗<small>DIREITA</small></button></div></section></main><aside id="modal"><article><span>🏟️</span><h1>HORA DO PÊNALTI</h1><p>Você bate e também defende. Escolha a dificuldade para começar.</p><div id="levels"><button data-level="easy">FÁCIL<small>Adversário menos preciso</small></button><button data-level="medium">MÉDIO<small>Desafio equilibrado</small></button><button data-level="hard">DIFÍCIL<small>Adversário muito esperto</small></button></div></article></aside><script src="game.js"></script></body></html>
